name: shadowburnv2
description: Solo Leveling Fitness RPG - ShadowBurn V2
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Envoi réseau (webhooks Stripe, téléchargement pack LAN, etc.)
  http: ^1.2.2
  web: ^1.1.1
  archive: ^3.6.1

  # QR CODE & SCANNER CAMÉRA
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Gestion d'état
  provider: ^6.1.2

  # Stockage, appareil et capteurs
  shared_preferences: ^2.5.4
  pedometer: ^4.1.1
  permission_handler: ^11.4.0
  device_info_plus: ^11.5.0

  # Notifications & vibrations
  flutter_local_notifications: ^17.2.4
  vibration: ^2.0.1

  # Arrière-plan natif
  workmanager: ^0.10.10

  # Audio
  audioplayers: ^5.2.1

  # Utilitaires / interface
  intl: ^0.19.0
  google_fonts: ^6.3.3
  url_launcher: ^6.3.1

  # Firebase (Core, Firestore, Auth & App Check)
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/google_fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/google_fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Orbitron-Black.ttf
          weight: 900

    - family: Rajdhani
      fonts:
        - asset: assets/google_fonts/Rajdhani-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Rajdhani-Bold.ttf
          weight: 700
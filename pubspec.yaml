name: shadowburnv2
description: Solo Leveling Fitness RPG - ShadowBurn V2
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Envoi réseau (webhooks Stripe, etc.)
  http: ^1.2.1

  # QR CODE
  qr_flutter: ^4.1.0

  # Gestion d'état
  provider: ^6.1.1

  # Stockage et capteurs
  shared_preferences: ^2.2.2
  pedometer: ^4.0.1
  permission_handler: ^11.1.0

  # Notifications & vibrations
  flutter_local_notifications: ^17.0.0
  vibration: ^2.0.1

  # Arrière-plan natif
  workmanager: ^0.9.0

  # Audio
  audioplayers: ^5.2.1

  # Utilitaires / interface
  intl: ^0.19.0
  google_fonts: ^6.3.3
  url_launcher: ^6.2.4

  # Firebase (Core, Firestore & Auth officielle)
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/google_fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/google_fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Orbitron-Black.ttf
          weight: 900

    - family: Rajdhani
      fonts:
        - asset: assets/google_fonts/Rajdhani-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Rajdhani-Bold.ttf
          weight: 700
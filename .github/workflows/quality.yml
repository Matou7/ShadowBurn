name: ShadowBurn Quality Checks — Static Analysis, Tests, Web and APK

concurrency:
  group: shadowburn-quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/shadowburn-stability-2026-11-03
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  flutter_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Firebase backend policy and syntax
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm test
          node --check index.js

      - name: Test Firestore security rules in emulator
        run: |
          npx --yes firebase-tools emulators:exec --only firestore --project demo-shadowburn "npm --prefix functions run test:rules"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test --no-pub

      - name: Build Web (no deployment)
        run: flutter build web --release --no-wasm-dry-run

      - name: Build Android APK (no publication)
        run: flutter build apk --release

      - name: Upload APK for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: shadowburn-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

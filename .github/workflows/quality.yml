name: ShadowBurn Quality Checks

concurrency:
  group: shadowburn-quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'work/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  flutter_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (report legacy issues without skipping runtime checks)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test --no-pub

      - name: Build Web (no deployment)
        run: flutter build web --release --no-wasm-dry-run

      - name: Build Android APK (no publication)
        run: flutter build apk --release

      - name: Upload APK for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: shadowburn-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

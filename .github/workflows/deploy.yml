name: Build APK & Deploy Firebase
on:
  push:
    branches: [ master, main ]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Repair Android NDK 27.0.12077973
        run: |
          rm -rf "$ANDROID_HOME/ndk/27.0.12077973" /usr/local/lib/android/sdk/ndk/27.0.12077973
          yes | sdkmanager --sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}" --install "ndk;27.0.12077973"

      - name: Build Android APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowburn-release
          path: build/app/outputs/flutter-apk/app-release.apk

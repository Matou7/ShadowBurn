<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShadowBurn Arène TV & Multijoueur">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shadowburn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShadowBurn Arena TV</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <style>
    body {
      background-color: #02070D;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <script>
    window._globalAudioStream = null;
    window._wantsAudioPlaying = false;

    function _initAudioStream() {
      if (!window._globalAudioStream) {
        // NE JAMAIS mettre crossOrigin = "anonymous" sur un flux Icecast/NRJ sinon le navigateur bloque le son (CORS)
        var audio = new Audio('https://streaming.nrjaudio.fm/ouf274tx4thg?origine=fluxradios&aw_0_1st.station=NRJ-Extravadance-Summer-2026');
        audio.preload = 'none';
        window._globalAudioStream = audio;
      }
      return window._globalAudioStream;
    }

    function _attemptPlay() {
      var audio = _initAudioStream();
      var playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          console.log("[WEB AUDIO] Flux NRJ actif.");
        }).catch(function(err) {
          console.warn("[WEB AUDIO] En attente d'un clic sur l'écran TV (Autoplay bloqué) :", err);
        });
      }
    }

    // Débloque automatiquement le son dès que tu cliques n'importe où sur la TV si un ordre de lecture était en attente
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      window.addEventListener(evt, function() {
        if (window._wantsAudioPlaying && window._globalAudioStream && window._globalAudioStream.paused) {
          _attemptPlay();
        }
      }, true);
    });

    window.setWebRadioState = function(shouldPlay) {
      window._wantsAudioPlaying = !!shouldPlay;
      if (window._wantsAudioPlaying) {
        _attemptPlay();
        return true;
      } else {
        if (window._globalAudioStream) {
          window._globalAudioStream.pause();
          // Coupe le buffer live pour éviter le décalage temporel à la reprise
          window._globalAudioStream.src = '';
          window._globalAudioStream = null;
        }
        return false;
      }
    };

    window.toggleWebRadio = function() {
      return window.setWebRadioState(!window._wantsAudioPlaying);
    };

    window.stopWebRadio = function() {
      window.setWebRadioState(false);
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShadowBurn Arène TV & Multijoueur">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shadowburn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShadowBurn Arena TV</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <style>
    body {
      background-color: #02070D;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <script>
    window._globalAudioStream = null;
    window._wantsAudioPlaying = false;
    window._currentStreamIndex = 0;

    // Liste ordonnée des flux directs officiels NRJ France (MP3 / AAC haute compatibilité HTML5)
    const NRJ_FALLBACK_STREAMS = [
      'https://scdn.nrjaudio.fm/adwz2/fr/30001/mp3_128.mp3?origine=fluxradios',
      'https://scdn.nrjaudio.fm/fr/30001/mp3_128.mp3?origine=fluxradios',
      'https://scdn.nrjaudio.fm/adwz2/fr/30001/aac_64.mp3?origine=fluxradios',
      'https://scdn.nrjaudio.fm/fr/30001/aac_64.mp3?origine=fluxradios'
    ];

    function _initAudioStream() {
      if (!window._globalAudioStream) {
        const url = NRJ_FALLBACK_STREAMS[window._currentStreamIndex];
        console.log("[WEB AUDIO] Initialisation du flux #" + window._currentStreamIndex + " :", url);
        
        var audio = new Audio(url);
        audio.preload = 'none';
        audio.volume = 1.0;

        // Bascule automatique sur le serveur de secours en cas d'erreur de source ou de flux mort
        audio.onerror = function() {
          console.warn("[WEB AUDIO] Échec du flux #" + window._currentStreamIndex + ", tentative avec le flux suivant...");
          if (window._wantsAudioPlaying && window._currentStreamIndex < NRJ_FALLBACK_STREAMS.length - 1) {
            window._currentStreamIndex++;
            window._globalAudioStream = null;
            _attemptPlay();
          } else {
            console.error("[WEB AUDIO] Tous les flux de secours ont échoué.");
            window._currentStreamIndex = 0;
          }
        };

        window._globalAudioStream = audio;
      }
      return window._globalAudioStream;
    }

    function _attemptPlay() {
      var audio = _initAudioStream();
      var playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          console.log("[WEB AUDIO] Flux NRJ actif et audible !");
        }).catch(function(err) {
          if (err.name === 'NotAllowedError') {
            console.warn("[WEB AUDIO] Autoplay bloqué par le navigateur : cliquez n'importe où sur l'écran TV.");
          } else if (err.name === 'NotSupportedError') {
            // Déclenche manuellement le fallback si le navigateur rejette la promesse directement
            if (audio.onerror) audio.onerror();
          } else {
            console.error("[WEB AUDIO] Erreur de lecture :", err);
          }
        });
      }
    }

    // Déverrouillage instantané dès la première interaction physique sur l'écran TV
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      window.addEventListener(evt, function() {
        if (window._wantsAudioPlaying && window._globalAudioStream && window._globalAudioStream.paused) {
          _attemptPlay();
        }
      }, true);
    });

    window.setWebRadioState = function(shouldPlay) {
      window._wantsAudioPlaying = !!shouldPlay;
      if (window._wantsAudioPlaying) {
        _attemptPlay();
        return true;
      } else {
        if (window._globalAudioStream) {
          window._globalAudioStream.pause();
          window._globalAudioStream.src = '';
          window._globalAudioStream = null;
        }
        window._currentStreamIndex = 0;
        return false;
      }
    };

    window.toggleWebRadio = function() {
      return window.setWebRadioState(!window._wantsAudioPlaying);
    };

    window.stopWebRadio = function() {
      window.setWebRadioState(false);
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
